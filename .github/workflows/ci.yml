name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check backend buildtools
      - run: python buildtools/fetch_models.py
      - run: python -m pytest backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run --reporter=verbose
      - run: npm run build

  # Pushing a v* tag builds the macOS DMG and attaches it to a GitHub Release.
  # The website's download button points at releases/latest/download/SmartNotes-mac-arm64.dmg.
  # Add signing/notarization secrets (CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID, ...) when available.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [backend, frontend]
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: npm
      - name: Create backend venv
        run: |
          python -m venv venv
          venv/bin/python -m pip install -r requirements-dev.txt
      - run: npm ci
      - run: npm run dist
      - uses: softprops/action-gh-release@v2
        with:
          files: release/SmartNotes-mac-arm64.dmg
          generate_release_notes: true
